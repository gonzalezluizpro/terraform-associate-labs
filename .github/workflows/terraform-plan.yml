name: Terraform Plan

# Triggers on every Pull Request targeting main
on:
  pull_request:
    branches:
      - main
    paths:
      - "project-02-cicd-pipeline/**"  # only runs when this folder changes

permissions:
  contents: read
  pull-requests: write   # needed to post plan as PR comment

env:
  TF_WORKING_DIR: project-02-cicd-pipeline

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Install Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
           cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      # 3. Configure AWS credentials from GitHub Secrets
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            eu-west-1

      # 4. terraform init
      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      # 5. Check formatting — fails the PR if .tf files are not formatted
      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      # 6. Validate HCL syntax
      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      # 7. Run plan and capture output
      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -no-color -out=tfplan
        continue-on-error: true   # post comment even if plan fails

      # 8. Post plan output as a PR comment
      - name: Post Plan to PR
        uses: actions/github-script@v7
        with:
          script: |
            const output = `### Terraform Plan 📋
            **Status:** ${{ steps.plan.outcome }}

            <details><summary>Show Plan</summary>

            \`\`\`hcl
            ${{ steps.plan.outputs.stdout }}
            \`\`\`

            </details>

            *Pushed by @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      # 9. Fail the workflow if plan failed
      - name: Plan Status Check
        if: steps.plan.outcome == 'failure'
        run: exit 1
